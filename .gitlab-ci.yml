# Plain test pipeline. Revisit when the project is packaged as a Spark application.
stages:
  - test
  - secret-detection

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SECRET_DETECTION_ENABLED: "true"

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection

test:
  stage: test
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip
  before_script:
    # Java lets the GraphFrames tests run; without it they are skipped, not failed
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-21-jre-headless > /dev/null
    - pip install -q -e ".[dev]"
  script:
    - pytest -q
