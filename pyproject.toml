[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-loan-monitor"
version = "0.2.0"
description = "Share-pledge exposure graph and margin-loan collateral monitor built on public filings"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Miguel Palanca" }]
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyspark==3.5.*",
    "networkx>=3.2",
    "yfinance>=0.2.40",
    "setuptools>=68",  # graphframes 0.8 imports pyspark.ml, which still needs distutils (shim) on Python 3.12+
]

[project.optional-dependencies]
dev = ["pytest>=8", "boto3>=1.34"]
s3 = ["boto3>=1.34"]

[project.scripts]
mlm = "mlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
